syntax = "proto3";
import "root.proto";

package finapp_rpc;

// =================== Service ===================

service AssetService {
  // --- Asset metadata ---
  rpc GetAsset(GetAssetInput) returns (GetAssetOutput);

  // --- Stateless analysis: compute for a range and return, nothing held on server ---
  rpc ComputeAssetAnalysis(ComputeAssetAnalysisInput) returns (ComputeAssetAnalysisOutput);

  // --- Stateful analysis session: server holds IAssetAnalysis between calls ---
  rpc OpenAssetAnalysisSession(OpenAssetAnalysisSessionInput)           returns (OpenAssetAnalysisSessionOutput);
  rpc UpdateAssetAnalysisSessionRange(UpdateSessionRangeInput)          returns (UpdateAssetAnalysisSessionOutput);
  rpc CloseAssetAnalysisSession(CloseSessionInput)                      returns (CloseSessionOutput);
}

// =================== Asset types ===================

message AssetData {
  AssetId  id              = 1;
  string   name            = 2;
  string   price_series_id = 3;  // defaults to ticker; overridden for ETFs / structured products
  Currency denomination    = 4;
}

// =================== RPC messages — metadata ===================

message GetAssetInput  { AssetId id = 1; }
message GetAssetOutput { AssetData asset = 1; }

// =================== RPC messages — analysis ===================

message ComputeAssetAnalysisInput {
  AssetId        asset_id      = 1;
  int64          start_ms      = 2;
  int64          end_ms        = 3;
  int64          frequency_ms  = 4;
  // Named transforms to compute (e.g. "return"). Empty means price only.
  repeated string transforms   = 5;
}
message ComputeAssetAnalysisOutput {
  AssetAnalysisResult result = 1;
}

message OpenAssetAnalysisSessionInput {
  AssetId        asset_id      = 1;
  int64          start_ms      = 2;
  int64          end_ms        = 3;
  int64          frequency_ms  = 4;
  repeated string transforms   = 5;
}
message OpenAssetAnalysisSessionOutput {
  SessionHandle       handle = 1;
  AssetAnalysisResult result = 2;
}

message UpdateAssetAnalysisSessionOutput {
  AssetAnalysisResult result = 1;
}

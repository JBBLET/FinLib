syntax = "proto3";

// finapp_rpc avoids a naming collision with the C++ finapp:: namespace.
package finapp_rpc;

// =================== Domain enums ===================

enum Currency {
  USD = 0;
  EUR = 1;
  JPY = 2;
  KRW = 3;
  CAD = 4;
  GBP = 5;
}

enum AssetType {
  EQUITY = 0;
  ETF    = 1;
  BOND   = 2;
  CASH   = 3;
  CRYPTO = 4;
}

enum TransactionType {
  BUY        = 0;
  SELL       = 1;
  DEPOSIT    = 2;
  WITHDRAWAL = 3;
  DIVIDEND   = 4;
  SPLIT      = 5;
}

// How portfolio NAV is computed.
enum NavMode {
  TARGET_WEIGHTED = 0;  // weights from targetAllocations, returns a normalised return index
  QUANTITY_BASED  = 1;  // snapshot share counts; override with a replayed NAV series for full history
}

// =================== Identity ===================

message AssetId {
  string    ticker = 1;
  AssetType type   = 2;
}

// =================== Time series primitives ===================

message TimeSeries {
  repeated int64  timestamps_ms = 1;
  repeated double values        = 2;
}

// =================== Analysis primitives ===================

message AnalysisStats {
  double mean     = 1;
  double std_dev  = 2;
  double variance = 3;
  double skewness = 4;
  double kurtosis = 5;
}

message NamedSeries {
  string     name   = 1;
  TimeSeries series = 2;
}

message NamedStats {
  string        name  = 1;
  AnalysisStats stats = 2;
}

// Analysis result for a single asset — used by both AssetService and
// PortfolioService (per-position breakdown inside PortfolioAnalysisResult).
message AssetAnalysisResult {
  AssetId              asset_id        = 1;
  TimeSeries           price_series    = 2;
  AnalysisStats        price_stats     = 3;
  repeated NamedSeries derived_series  = 4;  // e.g. "return", "volatility"
  repeated NamedStats  derived_stats   = 5;
}

// =================== Session management ===================

// Opaque handle returned by Open*Session RPCs.
message SessionHandle {
  string id = 1;
}

// Shared input for updating any analysis session's time window.
message UpdateSessionRangeInput {
  SessionHandle handle       = 1;
  int64         start_ms     = 2;
  int64         end_ms       = 3;
}

// Shared close messages.
message CloseSessionInput  { SessionHandle handle = 1; }
message CloseSessionOutput {}
